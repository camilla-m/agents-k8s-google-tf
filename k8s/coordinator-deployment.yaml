apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-adk-coordinator
  namespace: adk-travel
  labels:
    app: travel-adk-coordinator
    tier: application
spec:
  replicas: 3
  selector:
    matchLabels:
      app: travel-adk-coordinator
  template:
    metadata:
      labels:
        app: travel-adk-coordinator
        tier: application
    spec:
      serviceAccountName: adk-agents
      containers:
      - name: travel-adk-coordinator
        # Imagem única construída do root Dockerfile com código de src/
        image: IMAGE_URL
        ports:
        - containerPort: 8080
          name: http
        # Only variables the app actually reads (verified against src/ and main.py) -
        # ENVIRONMENT, ADK_VERSION and AI_PLATFORM_REGION used to be set here too but
        # no code path ever calls os.getenv() for them.
        env:
        - name: PORT
          value: "8080"
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: GOOGLE_CLOUD_LOCATION
          value: "REGION"
        - name: LOG_LEVEL
          value: "INFO"
        # ConfigMap reference (GEMINI_MODEL and the rest of the app config live here -
        # see k8s/configmap.yaml, kept as the single source of truth)
        envFrom:
        - configMapRef:
            name: adk-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: travel-adk-coordinator
  namespace: adk-travel
  labels:
    app: travel-adk-coordinator
spec:
  selector:
    app: travel-adk-coordinator
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: LoadBalancer
# Note: the adk-config ConfigMap lives in k8s/configmap.yaml (single source of truth).
# It used to be duplicated here with a different, drifting set of keys - removed to
# avoid the two copies fighting each other depending on kubectl apply order.