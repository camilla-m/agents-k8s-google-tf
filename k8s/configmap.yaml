apiVersion: v1
kind: ConfigMap
metadata:
  name: adk-config
  namespace: adk-travel
  labels:
    app: google-adk
    component: config
    version: "1.0"
  annotations:
    description: "Configuration for Google ADK Travel System - Service Account Only"
data:
  # Only variables the app actually reads (verified with grep against agents/ and
  # main.py). Keep it that way - see git history for what happens when config drifts
  # from what the code reads (dead keys that look load-bearing but aren't, or three
  # competing definitions of the same ConfigMap).
  GOOGLE_CLOUD_PROJECT: "PROJECT_ID"  # This will be replaced by deploy script
  GOOGLE_CLOUD_LOCATION: "REGION"
  LOG_LEVEL: "INFO"
  PORT: "8080"

  # Use Vertex AI (Workload Identity / ADC), not the Gemini Developer API - which
  # would need GOOGLE_API_KEY, which we deliberately don't set.
  GOOGLE_GENAI_USE_VERTEXAI: "TRUE"

  # Gemini model. gemini-1.5-pro/gemini-pro are retired on Vertex AI - keep this in
  # sync with whatever Gemini model family is currently supported for your
  # project/region.
  GEMINI_MODEL: "gemini-2.5-flash"